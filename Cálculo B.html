<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#080b14;color:#e8eaf3;font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.display{font-family:'Space Grotesk',sans-serif}.card{background:linear-gradient(145deg,#151a2b,#101525);border:1px solid #ffffff14;box-shadow:0 12px 40px #0003}.muted{color:#929bb4}.pill{background:#ffffff08;border:1px solid #ffffff16}.active{background:#202744;color:#c4caff;box-shadow:inset 2px 0 #818cf8}.gradient{background:linear-gradient(110deg,#8b9bff,#c084fc)}.fade{animation:fadein .35s ease}

<script type="text/babel">
const {useState,useEffect,useRef}=React;
function CountUp({value}){const m=String(value).match(/^(\d+)(.*)$/),target=m?+m[1]:0,prev=useRef(0),[n,setN]=useState(0);
useEffect(()=>{if(!m)return;let raf,s=performance.now(),from=prev.current;const step=t=>{let p=Math.min((t-s)/900,1),e=1-Math.pow(1-p,3);setN(Math.round(from+(target-from)*e));if(p<1)raf=requestAnimationFrame(step);else prev.current=target};raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf)},[target]);
return m?<>{n}{m[2]}</>:<>{value}</>}
const modules=[
{name:'Técnicas de integração',icon:'∫',topics:['Primitivas e integrais indefinidas','Propriedades e integrais imediatas','Substituição','Integração por partes','Integrais definidas','Teorema Fundamental do Cálculo','Aplicações das integrais']},
{name:'Funções de várias variáveis',icon:'ƒ',topics:['Domínio e imagem','Gráficos tridimensionais','Curvas de nível','Limites em duas variáveis','Continuidade e interpretação geométrica']},
{name:'Derivadas parciais e diferenciabilidade',icon:'∂',topics:['Derivadas parciais de primeira ordem','Derivadas de ordens superiores e mistas','Diferenciabilidade e plano tangente','Aproximação linear','Regra da cadeia e derivação implícita','Derivadas direcionais e gradiente']},
{name:'Máximos e mínimos',icon:'⌁',topics:['Pontos críticos','Extremos locais e absolutos','Pontos de sela','Matriz Hessiana e teste da segunda derivada','Multiplicadores de Lagrange']},
{name:'Integrais duplas',icon:'∬',topics:['Interpretação geométrica e Fubini','Regiões retangulares e gerais','Integrais iteradas','Mudança de ordem','Coordenadas polares','Mudança de variáveis e Jacobiano','Aplicações físicas e geométricas']},
{name:'Integrais de linha e campos vetoriais',icon:'∮',topics:['Parametrização e comprimento de curvas','Integrais de primeira espécie','Campos vetoriais e trabalho','Integral de segunda espécie e fluxo','Componentes tangenciais e normais','Teorema de Green: formas tangencial e normal','Identidade de Green no plano']}
];
const lessons={
'Primitivas e integrais indefinidas':{intro:'Integrar é reconstruir uma quantidade a partir de sua taxa de variação. Conhecida a velocidade, uma primitiva recupera a posição, a menos de uma constante inicial.',concept:'F é primitiva de f num intervalo quando F′(x)=f(x). Duas primitivas da mesma função diferem por uma constante, pois toda função com derivada nula em intervalo é constante.',formula:'∫ f(x) dx = F(x) + C, se F′(x)=f(x)',geometry:'A integral definida acumula valores assinados: área acima do eixo é positiva e abaixo é negativa. A constante surge porque derivar elimina constantes.',example:'∫(3x²−4x+2)dx=x³−2x²+2x+C. Verificação: derivando, recuperamos 3x²−4x+2.',practice:'Encontre uma primitiva de 6x−5; use F(0)=3 para determinar C.',summary:'Linearidade: ∫(af+bg)=a∫f+b∫g. Regra da potência: ∫xⁿdx=xⁿ⁺¹/(n+1)+C (n≠−1). Confira derivando.'},
'Teorema Fundamental do Cálculo':{intro:'O teorema conecta acumulação e taxa de variação: derivar uma quantidade acumulada recupera a função original.',concept:'Se f é contínua e A(x)=∫ₐˣf(t)dt, então A′(x)=f(x). Se F′=f, a integral definida vale F(b)−F(a).',formula:'d/dx ∫ₐˣ f(t)dt=f(x);  ∫ₐᵇf(x)dx=F(b)−F(a)',geometry:'A(x) mede área líquida entre a e x. Quando f(x)>0 a área cresce; quando f(x)<0, decresce.',example:'∫₀²(3x²+1)dx=[x³+x]₀²=8+2=10.',practice:'Calcule ∫₁³2x dx e interprete a área geométrica.',summary:'Encontre uma primitiva e avalie nos extremos, sempre superior menos inferior.'},
'Derivadas parciais de primeira ordem':{intro:'Numa superfície z=f(x,y), medimos a inclinação mantendo uma coordenada fixa e variando a outra.',concept:'fₓ varia x mantendo y constante; fᵧ varia y mantendo x constante. São derivadas ordinárias após fixar a outra variável.',formula:'fₓ(a,b)=limₕ→0 [f(a+h,b)−f(a,b)]/h',geometry:'As parciais são inclinações das curvas obtidas ao cortar a superfície com planos y=b ou x=a.',example:'f=x²y+3y: fₓ=2xy e fᵧ=x²+3. Em (1,2), ambas valem 4.',practice:'Calcule fₓ e fᵧ para f=x³+xy² no ponto (1,2).',summary:'Trate as demais variáveis como constantes. Parciais contínuas numa vizinhança garantem diferenciabilidade.'},
'Derivadas direcionais e gradiente':{intro:'O gradiente indica a direção de crescimento mais rápido de uma função escalar.',concept:'Para vetor unitário u, Dᵤf=∇f·u. O gradiente é perpendicular às curvas de nível regulares.',formula:'∇f=(fₓ,fᵧ); Dᵤf=∇f·u',geometry:'O produto escalar projeta o gradiente na direção escolhida; sua norma é a maior taxa de crescimento por unidade de distância.',example:'Para f=x²+y² em (1,2), ∇f=(2,4). Na direção u=(1,0), Dᵤf=2.',practice:'Determine o gradiente de f=xy em (2,3) e a taxa na direção (0,1).',summary:'Normalize o vetor de direção antes de calcular a derivada direcional.'},
'Integrais duplas':{intro:'Uma integral dupla soma contribuições distribuídas sobre uma região: altura vezes pequenos elementos de área.',concept:'Para f contínua numa região retangular, a integral dupla é o limite de somas de Riemann. Se f≥0, representa volume sob z=f(x,y).',formula:'∬ᴿ f(x,y)dA=∫ₐᵇ∫꜀ᵈ f(x,y)dy dx',geometry:'Particionamos R em retângulos de área ΔA e somamos f(xᵢ,yᵢ)ΔA. Fubini permite calcular como integrais iteradas.',example:'∬_[0,1]×[0,2](x+y)dA=∫₀¹(x+2)dx=5/2.',practice:'Calcule ∬_[0,1]×[0,1]xy dA por integrais iteradas.',summary:'Descreva a região e os limites; para círculos, coordenadas polares podem simplificar.'},
'Teorema de Green: formas tangencial e normal':{intro:'Green transforma circulação ou fluxo ao longo de uma curva fechada numa integral dupla sobre a região interna.',concept:'Para C simples, fechada e positivamente orientada, e P,Q de classe C¹, a circulação do campo (P,Q) é a integral dupla de Qₓ−Pᵧ.',formula:'∮꜀P dx+Q dy=∬ᵣ(Qₓ−Pᵧ)dA',geometry:'A forma tangencial soma circulação na fronteira. A forma normal relaciona fluxo de saída à divergência: ∮P dy−Q dx=∬(Pₓ+Qᵧ)dA.',example:'Para P=−y/2, Q=x/2 e círculo unitário anti-horário, Qₓ−Pᵧ=1; a circulação é a área do disco, π.',practice:'Use Green para achar a circulação de F=(-y,x) ao redor do círculo de raio 2, orientação positiva.',summary:'Verifique orientação, simplicidade, regularidade do campo e ausência de singularidades na região.'}
};
const nav=[['Dashboard','⌂'],['Conteúdos','▤'],['Exercícios','✓'],['Laboratório Matemático','∑'],['Professor IA','✦'],['Aplicações em Engenharia','⚙'],['Biblioteca de Fórmulas','π'],['Configurações','⚙']];
function App(){
const [page,setPage]=useState('Dashboard'),[mi,setMi]=useState(0),[topic,setTopic]=useState(modules[0].topics[0]),[filter,setFilter]=useState(''),[expr,setExpr]=useState('x**3 + 2*x'),[op,setOp]=useState('derivative'),[result,setResult]=useState(''),[busy,setBusy]=useState(false),[quiz,setQuiz]=useState('');
const [stats,setStats]=useState(()=>JSON.parse(localStorage.getItem('ci-progress')||'{"done":0,"attempts":0,"correct":0,"visited":[]}'));
useEffect(()=>localStorage.setItem('ci-progress',JSON.stringify(stats)),[stats]);useEffect(()=>{if(page==='Laboratório Matemático')return plot()},[page]);
function plot(){let el=document.getElementById('plot');if(!el||!window.Plotly)return;let x=[],y=[];for(let i=-5;i<=5.001;i+=.1){x.push(i);y.push(Math.sin(i))}const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;let dead=false,raf;Plotly.newPlot(el,[{x:reduce?x:[],y:reduce?y:[],type:'scatter',mode:'lines',line:{color:'#9b8cff',width:3,shape:'spline'}}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#aab1c8'},margin:{l:40,r:20,t:20,b:40},xaxis:{gridcolor:'#ffffff12',range:[-5,5]},yaxis:{gridcolor:'#ffffff12',range:[-1.2,1.2]}},{responsive:true,displaylogo:false}).then(()=>{if(reduce)return;let n=0;const step=()=>{if(dead)return;n=Math.min(n+2,x.length);Plotly.restyle(el,{x:[x.slice(0,n)],y:[y.slice(0,n)]},[0]);if(n<x.length)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)});return()=>{dead=true;cancelAnimationFrame(raf)}}
function mark(){if(!stats.visited.includes(topic))setStats({...stats,done:stats.done+1,visited:[...stats.visited,topic]})}function attempt(ok){setStats({...stats,attempts:stats.attempts+1,correct:stats.correct+(ok?1:0)});setQuiz(ok?'Correto! ∫6x dx=3x² e ∫−5 dx=−5x; logo, 3x²−5x+C.':'Revise a regra da potência e tente novamente.')}
async function calculate(){setBusy(true);setResult('');try{let r=await fetch('http://localhost:8000/api/math',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expression:expr,operation:op})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Erro na API');setResult(d.result||JSON.stringify(d,null,2))}catch(e){setResult('Backend matemático indisponível: '+e.message+'. Inicie a API FastAPI em http://localhost:8000. Nenhum resultado simbólico foi simulado.')}finally{setBusy(false)}}
let progress=Math.round(stats.done/modules.reduce((n,m)=>n+m.topics.length,0)*100),box='card rounded-2xl p-5';
function lessonContent(){let d=lessons[topic]||{intro:'Este tópico desenvolve ferramentas fundamentais de Cálculo B, articulando definições, interpretação geométrica e aplicações.',concept:`Em ${topic.toLowerCase()}, formule hipóteses antes de aplicar resultados. A compreensão das definições permite escolher uma técnica válida e interpretar a resposta.`,formula:'Definição + hipóteses ⇒ conclusão matemática',geometry:'Interprete as variáveis e o objeto geométrico antes de calcular; curvas, superfícies e regiões ajudam a verificar o resultado.',example:'Identifique os dados, escreva a definição apropriada, execute o cálculo e confira hipóteses e unidades.',practice:'Construa um exemplo, explicite as hipóteses e valide o resultado por um método independente.',summary:'Reconheça as hipóteses, escolha a ferramenta adequada e confira a interpretação.'};return <div key={topic} className="space-y-4 fade"><div className={box}><div className="text-xs uppercase tracking-widest text-indigo-300">Módulo {mi+1} · Aula</div><h2 className="display text-3xl mt-2">{topic}</h2><p className="muted mt-2 leading-7">{d.intro}</p><div className="grid md:grid-cols-2 gap-4 mt-5"><section className="pill rounded-xl p-4"><b className="text-indigo-200">Conceito</b><p className="muted mt-2 leading-6">{d.concept}</p></section><section className="pill rounded-xl p-4"><b className="text-purple-200">Interpretação geométrica</b><p className="muted mt-2 leading-6">{d.geometry}</p></section></div><div className="mt-4 rounded-xl bg-indigo-400/10 border border-indigo-300/15 p-4"><div className="text-xs muted mb-2">FÓRMULA ESSENCIAL</div><div className="font-mono text-lg text-indigo-100">{d.formula}</div></div></div><div className="grid md:grid-cols-2 gap-4"><section className={box}><b>Exemplo resolvido</b><p className="muted mt-3 leading-7">{d.example}</p></section><section className={box}><b>Resumo</b><p className="muted mt-3 leading-7">{d.summary}</p></section></div><section className={box}><b>Exercício</b><p className="muted mt-2">{d.practice}</p><div className="flex gap-2 mt-4"><button onClick={()=>attempt(true)} className="rounded-lg bg-indigo-500 px-4 py-2 text-sm">Verificar resposta</button><button onClick={()=>attempt(false)} className="pill rounded-lg px-4 py-2 text-sm">Dica</button></div>{quiz&&<p key={stats.attempts} className="pop mt-3 text-indigo-200 text-sm">{quiz}</p>}</section><button onClick={mark} className="rounded-xl gradient text-slate-950 font-semibold px-5 py-3">Concluir aula e salvar progresso ↗</button></div>}
function dashboard(){return <div className="space-y-5 fade"><section className="rounded-3xl p-8" style={{background:'radial-gradient(ellipse at 80% 10%,#53439a88,transparent 45%),linear-gradient(115deg,#171c35,#101525)'}}><div className="text-indigo-200 text-sm">PLANO DE ESTUDOS · MATA03 / UFBA</div><h2 className="display text-4xl font-semibold mt-3">Olá, estudante.</h2><p className="muted mt-2">Aprenda cálculo multivariável com rigor, intuição geométrica e prática guiada.</p><button onClick={()=>setPage('Conteúdos')} className="mt-5 rounded-xl gradient text-slate-950 font-semibold px-4 py-2.5">Continuar aprendendo →</button><span className="anim-float float-right text-7xl text-indigo-200/20">∫∇</span></section><div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">{[['Progresso geral',progress+'%'],['Aulas concluídas',stats.done],['Exercícios tentados',stats.attempts],['Taxa de acerto',(stats.attempts?Math.round(stats.correct/stats.attempts*100):0)+'%']].map(x=><div className={box} key={x[0]}><div className="muted text-sm">{x[0]}</div><div className="display text-3xl mt-2"><CountUp value={x[1]}/></div><div className="h-1.5 bg-white/10 rounded-full mt-4"><div className="h-full gradient rounded-full" style={{width:progress+'%'}}/></div></div>)}</div><div className="grid lg:grid-cols-3 gap-4"><div className={`${box} lg:col-span-2`}><h3 className="font-semibold">Trilha de aprendizagem</h3><div className="mt-4 space-y-4">{modules.map((m,i)=><button key={m.name} onClick={()=>{setMi(i);setTopic(m.topics[0]);setPage('Conteúdos')}} className="w-full text-left flex gap-3 items-center"><span className="w-10 h-10 rounded-xl bg-indigo-400/10 text-indigo-200 grid place-items-center text-xl">{m.icon}</span><span className="flex-1 text-sm">{m.name}<i className="block h-1 bg-white/10 rounded-full mt-2"><i className="block h-full bg-indigo-400 rounded-full" style={{width:stats.visited.filter(t=>m.topics.includes(t)).length/m.topics.length*100+'%'}}/></i></span><span className="muted text-xs">{stats.visited.filter(t=>m.topics.includes(t)).length}/{m.topics.length}</span></button>)}</div></div><div className={box}><h3 className="font-semibold">Próximo recomendado</h3><p className="muted text-sm mt-3">Comece pelos fundamentos e avance às aplicações após dominar as definições.</p><button onClick={()=>setPage('Conteúdos')} className="mt-4 text-indigo-300 text-sm">Abrir conteúdos →</button><hr className="border-white/10 my-5"/><h3 className="font-semibold">Atividade recente</h3><p className="muted text-sm mt-3">{stats.visited.length?'Última aula: '+stats.visited.at(-1):'Aulas concluídas aparecerão aqui.'}</p></div></div></div>}
function formulas(){let data=[['Regra da potência','∫xⁿdx=xⁿ⁺¹/(n+1)+C, n≠−1','n real; em intervalos onde a expressão está definida.'],['Integração por partes','∫u dv=uv−∫v du','Escolha u e dv para simplificar a integral restante.'],['Plano tangente','z=f(a,b)+fₓ(a,b)(x−a)+fᵧ(a,b)(y−b)','f diferenciável em (a,b).'],['Gradiente','∇f=(fₓ,fᵧ); Dᵤf=∇f·u','u unitário para taxa por unidade de distância.'],['Hessiana 2×2','D=fₓₓfᵧᵧ−(fₓᵧ)²','No ponto crítico: D>0,fₓₓ>0 mínimo; D>0,fₓₓ<0 máximo; D<0 sela.'],['Coordenadas polares','x=r cosθ,y=r sinθ,dA=r dr dθ','r é o valor absoluto do Jacobiano.'],['Teorema de Green','∮(Pdx+Qdy)=∬(Qₓ−Pᵧ)dA','Curva fechada simples, orientação positiva e campo C¹.']];return <div className="fade"><input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Pesquisar fórmula ou teorema…" className="w-full rounded-xl bg-[#12182a] border border-white/10 p-3 mb-4"/><div className="grid md:grid-cols-2 gap-4">{data.filter(x=>x.join(' ').toLowerCase().includes(filter.toLowerCase())).map(x=><div className={box} key={x[0]}><b className="text-indigo-200">{x[0]}</b><div className="font-mono text-sm mt-3">{x[1]}</div><p className="muted text-sm mt-3">{x[2]}</p></div>)}</div></div>}
function content(){if(page==='Dashboard')return dashboard();if(page==='Conteúdos')return <div className="grid lg:grid-cols-[240px,1fr] gap-4 fade"><aside className={`${box} h-fit`}>{modules.map((m,i)=><button key={m.name} onClick={()=>{setMi(i);setTopic(m.topics[0])}} className={`w-full text-left p-3 rounded-xl text-sm mb-1 ${mi===i?'active':'muted hover:bg-white/5'}`}>{m.icon}　{m.name}</button>)}</aside><div><div className={`${box} mb-4`}><div className="text-xs text-indigo-300">MÓDULO {mi+1}</div><h2 className="display text-2xl mt-1">{modules[mi].name}</h2><div className="flex flex-wrap gap-2 mt-4">{modules[mi].topics.map(t=><button key={t} onClick={()=>{setTopic(t);setQuiz('')}} className={`pill rounded-full px-3 py-1.5 text-xs ${topic===t?'border-indigo-300/50 text-indigo-200':''}`}>{t}</button>)}</div></div>{lessonContent()}</div></div>;if(page==='Biblioteca de Fórmulas')return formulas();if(page==='Exercícios')return <div className={`${box} fade`}><div className="text-xs text-indigo-300">TREINO · MÓDULO 1 · BÁSICO</div><h2 className="display text-2xl mt-2">Encontre ∫(6x−5) dx</h2><p className="muted mt-2">Use a linearidade e a regra da potência.</p><div className="grid sm:grid-cols-3 gap-3 mt-5">{['3x²−5x+C','6x²−5+C','3x²−5'].map((a,i)=><button onClick={()=>attempt(i===0)} key={a} className="pill rounded-xl p-4 text-left">{a}</button>)}</div>{quiz&&<p key={stats.attempts} className="pop mt-4 text-indigo-200">{quiz}</p>}<p className="muted text-sm mt-5">Tentativas e acertos são salvos no navegador.</p></div>;if(page==='Laboratório Matemático')return <div className="grid lg:grid-cols-2 gap-4 fade"><section className={box}><div className="text-xs tracking-widest text-indigo-300">SYMPY · API LOCAL</div><h2 className="display text-2xl mt-2">Laboratório matemático</h2><p className="muted text-sm mt-2">A expressão é enviada ao backend; resultados não são simulados.</p><label className="block muted text-sm mt-5">Operação</label><select value={op} onChange={e=>setOp(e.target.value)} className="w-full mt-2 rounded-xl bg-[#0b1020] border border-white/10 p-3">{[['derivative','Derivada'],['integral','Integral indefinida'],['definite_integral','Integral definida'],['partial_derivative','Derivada parcial'],['gradient','Gradiente'],['hessian','Hessiana'],['jacobian','Jacobiano'],['simplify','Simplificação']].map(x=><option value={x[0]}>{x[1]}</option>)}</select><label className="block muted text-sm mt-4">Expressão (sintaxe SymPy)</label><input value={expr} onChange={e=>setExpr(e.target.value)} className="w-full mt-2 rounded-xl bg-[#0b1020] border border-white/10 p-3 font-mono"/><button disabled={busy} onClick={calculate} className="mt-4 rounded-xl gradient text-slate-950 font-semibold px-5 py-2.5">{busy?'Calculando…':'Calcular'}</button>{result&&<pre key={result} className="pop whitespace-pre-wrap break-words rounded-xl bg-black/30 border border-white/10 p-4 mt-4 text-sm text-indigo-100">{result}</pre>}<p className="text-xs muted mt-4">Valide entrada e restrinja operações SymPy no backend antes de disponibilizar publicamente.</p></section><section className={box}><h3 className="font-semibold">Visualização interativa · y=sin(x)</h3><p className="muted text-xs mt-1">Gráfico Plotly 2D; arraste para explorar.</p><div id="plot" className="w-full h-[330px] mt-3"/></section></div>;if(page==='Professor IA')return <div className={`${box} max-w-2xl fade`}><div className="text-3xl">✦</div><h2 className="display text-2xl mt-3">Professor Calculus</h2><p className="muted leading-7 mt-3">Integração com provedor de IA não configurada. Habilite-a com chave armazenada somente no servidor e endpoint autenticado. Não exponha credenciais; nenhuma resposta de IA será simulada.</p><div className="pill rounded-xl p-4 mt-5 text-sm"><span className="text-indigo-200">Estado:</span> integração não configurada</div></div>;if(page==='Aplicações em Engenharia'){let a=[['Gradiente e transferência de calor','O gradiente aponta para o aumento mais rápido da temperatura. A lei de Fourier modela o fluxo como proporcional a −∇T.'],['Parciais e otimização','Pontos críticos e restrições ajudam a localizar configurações eficientes.'],['Integrais duplas e massa','Para densidade superficial ρ, massa = ∬ᴿρ dA; momentos determinam centro de massa.'],['Jacobiano e coordenadas','Transformações reescalam elementos de área pelo determinante Jacobiano.'],['Integrais de linha e trabalho','O trabalho de F ao longo de r(t) é ∫F(r(t))·r′(t)dt.'],['Campos vetoriais e eletromagnetismo','Divergência e circulação quantificam fontes e rotação de campos.'],['Green e fluxo','Relaciona circulação ou fluxo na fronteira a rotação ou divergência no interior.']];return <div className="grid md:grid-cols-2 gap-4 fade">{a.map(x=><div className={box} key={x[0]}><div className="text-indigo-300 text-xl">⌁</div><h3 className="font-semibold mt-2">{x[0]}</h3><p className="muted text-sm leading-6 mt-2">{x[1]}</p></div>)}</div>}if(page==='Configurações')return <div className={`${box} max-w-2xl`}><h2 className="display text-2xl">Configurações</h2><p className="muted mt-3">Tema escuro · Português (Brasil). Progresso armazenado neste navegador.</p><button onClick={()=>{localStorage.removeItem('ci-progress');setStats({done:0,attempts:0,correct:0,visited:[]})}} className="mt-5 rounded-xl border border-red-400/30 text-red-200 px-4 py-2">Limpar progresso local</button></div>}
return <div className="min-h-screen md:flex"><div className="orb o1"/><div className="orb o2"/><aside className="md:fixed md:inset-y-0 md:w-[250px] bg-[#0c101c] border-r border-white/5 p-4 flex md:flex-col"><div className="flex items-center gap-3 px-2 py-3"><div className="logo w-10 h-10 rounded-xl gradient text-slate-950 grid place-items-center text-xl font-bold">∫</div><div><div className="display font-semibold tracking-wide">CALCULUS</div><div className="text-[10px] tracking-[.23em] text-indigo-300">INTELLIGENCE</div></div></div><div className="hidden md:block text-[10px] tracking-[.2em] muted px-3 mt-9 mb-3">PLATAFORMA</div><nav className="md:space-y-1 flex md:block gap-1 overflow-x-auto ml-auto md:ml-0">{nav.map(([n,ico])=><button key={n} onClick={()=>setPage(n)} className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm whitespace-nowrap w-full ${page===n?'active':'muted hover:bg-white/5'}`}><span className="text-lg w-5">{ico}</span><span className="hidden md:inline">{n}</span></button>)}</nav><div className="hidden md:block card rounded-2xl p-4 mt-auto"><div className="text-xs text-indigo-200">SEU PROGRESSO</div><div className="flex justify-between mt-3 text-sm"><span className="muted">Programa</span><span><CountUp value={progress+'%'}/></span></div><div className="h-1.5 bg-white/10 rounded-full mt-2"><div className="h-full gradient rounded-full" style={{width:progress+'%'}}/></div></div></aside><main className="md:ml-[250px] min-h-screen"><header className="sticky top-0 z-10 bg-[#080b14]/85 backdrop-blur border-b border-white/5 px-5 md:px-8 py-4 flex justify-between items-center"><div><div className="text-xs muted">MATA03 · CÁLCULO B</div><h1 key={page} className="display font-semibold mt-1 rise-in">{page}</h1></div><div className="pill rounded-full px-3 py-1.5 text-xs text-indigo-200"><span className="dot"/>Aprendizagem ativa</div></header><div className="p-5 md:p-8 max-w-[1400px] mx-auto"><div key={page}>{content()}</div><footer className="muted text-xs mt-10 pb-4">Calculus Intelligence · Cálculo B · Progresso salvo localmente.</footer></div></main></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
